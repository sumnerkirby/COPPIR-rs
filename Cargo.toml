[package]
name = "coppir"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Common Operational Picture Program for Incident Response"
repository = "https://github.com/sumnerkirby/COPPIR-rs"
publish = false
default-run = "coppir"

[features]
default = ["desktop"]
# The native window. Without it the binary is a plain local server you open in
# a browser, which is also what CI and the test suite build.
desktop = ["dep:wry", "dep:tao"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
indexmap = { version = "2", features = ["serde"] }
reqwest = { version = "0.13", features = ["json", "form", "query"] }
rust-embed = { version = "8", features = ["mime-guess"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "fs", "time"] }
tracing = "0.1"
ts-rs = { version = "12", features = ["serde-json-impl", "indexmap-impl", "no-serde-warnings"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

tao = { version = "0.37", optional = true }
wry = { version = "0.57", optional = true }

[dev-dependencies]
futures-util = "0.3"
tempfile = "3"
tokio-tungstenite = "0.30"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
