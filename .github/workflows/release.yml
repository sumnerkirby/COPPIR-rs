name: release

# Push a tag such as v0.2.0 to build every installer and attach them to a
# draft GitHub release. Run it by hand (Actions → release → Run workflow) to
# build the installers as workflow artifacts without releasing anything.
# See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  package:
    name: package (${{ matrix.name }})
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            formats: dmg
          - name: Windows
            os: windows-latest
            formats: nsis
          # The oldest supported Ubuntu, so the binary runs on older glibc.
          - name: Linux
            os: ubuntu-22.04
            formats: deb,appimage
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager
      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev file

      - name: Build (macOS, Apple Silicon and Intel in one app)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/coppir \
            target/aarch64-apple-darwin/release/coppir target/x86_64-apple-darwin/release/coppir
          lipo -info target/universal-apple-darwin/release/coppir
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cargo packager --release --target universal-apple-darwin --formats ${{ matrix.formats }}

      - name: Build and package
        if: runner.os != 'macOS'
        shell: bash
        env:
          # linuxdeploy is itself an AppImage; CI machines have no FUSE to mount it.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          cargo build --release
          cargo packager --release --formats ${{ matrix.formats }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir dist
          find target -maxdepth 4 -type f \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.AppImage' \) \
            -not -path '*/deps/*' -exec cp {} dist/ \;
          ls -la dist
          test -n "$(ls dist)"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: The tag matches the version in Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --generate-notes --title "COPPIR ${GITHUB_REF_NAME#v}" \
            --notes-file docs/release-notes.md
