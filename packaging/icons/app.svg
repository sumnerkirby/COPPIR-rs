<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- The app icon on Apple's grid: a 824-unit tile centred in 1024, so it sits
       at the same size as other apps in the Dock. -->
  <g transform="translate(100 100) scale(8.24)">
    <rect width="100" height="100" rx="22" ry="22" fill="#000a00"/>
    <path d="M 10 50 Q 50 12 90 50 Q 50 88 10 50 Z" fill="none" stroke="white" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="16" fill="none" stroke="white" stroke-width="5"/>
    <circle cx="50" cy="50" r="7" fill="white"/>
  </g>
</svg>
